on: push

env:
  MVN_SRC_DIR: '.'
  
jobs:
  oas-gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: oas-gen
        uses: Clemi2806/oas-gen@46dbebb7e4ade418bc3a15e8b8dd72ff43553d06
        with: 
          mvn_src_path: ""
      - name: 'Process output file'
        run: cat ${{steps.oas-gen.outputs.path_to_oas}}
    
    
          
