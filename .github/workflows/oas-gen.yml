on: push

jobs:
  oas-gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: oas-gen
        uses: Clemi2806/oas-gen@6b1f0101c3d8a2d4ca7735d24f04ba16bd1a4efd
        with: 
          mvn_src_path: ${{github.workspace}}
      - name: 'Process output file'
        run: cat ${{steps.oas-gen.outputs.path_to_oas}}
    
    
          
