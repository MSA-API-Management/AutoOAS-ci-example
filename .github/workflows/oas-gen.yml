on: push

env:
  MVN_SRC_DIR: '' # Leave empty for root directory
  
jobs:
  oas-gen:
    runs-on: ubuntu-latest
    outputs:
      oas_file: ${{steps.proc_out.outputs}}
    steps:
      - uses: actions/checkout@v4
        with:
          path: oas-gen
      - name: 'Run OAS-Gen tool on MVN src folder'
        run: docker run -v oas-gen${{env.MVN_SRC_DIR}}:/project alexx882/oas-gen:1.0 /project /project/target/docker/out/oas
      - id: proc_out
        name: 'Process output file'
        run: echo "oas_file_path=$(pwd)/target/docker/out/oas" >> "$GITHUB_OUTPUT"
          
