name: 'OAS-gen GitHub Action'

on:
  push:
    branches: 
      - main
jobs:
  oas-gen:
    runs-on: ubuntu-latest
    outputs:
      generated: ${{ steps.proc_out.outputs }}
    container: 
      image: alexx882/oas-gen:1.0
      volumes:
        - ${{ vars.MVN_SRC_DIR }}:/project
      options: /project /project/target/docker-output/oas
      
        
