name: 'OAS-gen Action'
description: 'Generates an OAS of a Spring project'

inputs:
  mvn_src_path:
    description: 'Path to the Maven directory'
    required: true
    default: ""

outputs:
  path_to_oas:
    description: 'Path to the OAS file'
    value: ${{ steps.proc_out.outputs.oas_file_path }}

runs:
  using: "composite"
  steps:
      - name: 'Run OAS-Gen tool on MVN src folder'
        run: docker run -v ${{inputs.mvn_src_dir}}:/project alexx882/oas-gen:1.0 /project /project/target/docker/out/oas
      - id: proc_out
        name: 'Process output file'
        run: echo "oas_file_path=${{inputs.mvn_src_dir}}/target/docker/out/oas_default.json" >> "$GITHUB_OUTPUT"
